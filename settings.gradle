pluginManagement {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.5.0'
}

rootProject.name = 'ysm-epicfight-compat'

if (file('../YSM-Mapping-API/api/build.gradle.kts').isFile()) {
    includeBuild('../YSM-Mapping-API')
} else {
    throw new GradleException('YSM-Mapping-API mc/1.20.1 checkout must exist beside this repository.')
}
