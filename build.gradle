plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'ysm-epicfight-compat'
}

def ysmMappingApiDependencyVersion = gradle.ext.ysmMappingApiDependencyVersion

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run-server')
            args '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net' }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        forRepositories(fg.repository)
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("maven.modrinth:epic-fight:${epicfight_version}")
    compileOnly "net.okitsu.ysmmapping:api:${ysmMappingApiDependencyVersion}"
    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation 'com.github.luben:zstd-jni:1.5.6-3'
    jarJar 'com.github.luben:zstd-jni:[1.5.6-3,1.5.6-3]'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testCompileOnly "net.okitsu.ysmmapping:api:${ysmMappingApiDependencyVersion}"
    testRuntimeOnly "net.okitsu.ysmmapping:api:${ysmMappingApiDependencyVersion}"
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            ysm_version_range: ysm_version_range,
            epicfight_version_range: epicfight_version_range,
            ysm_mapping_api_version_range: ysm_mapping_api_version_range,
            configured_version_range: configured_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(Jar).configureEach {
    archiveVersion = "mc${minecraft_version}-${mod_version}"
    manifest {
        attributes['MixinConfigs'] = 'ysm_epicfight_compat.mixins.json'
    }
}

jar.finalizedBy('reobfJar')
jarJar.enable()
tasks.named('jarJar').configure {
    finalizedBy 'reobfJarJar'
}

tasks.register('verifyDistributions') {
    dependsOn 'reobfJarJar'
    doLast {
        def archive = tasks.named('jarJar', Jar).get().archiveFile.get().asFile
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            ['META-INF/mods.toml', 'META-INF/ysm-mapping-api/requests-v1.json',
             'ysm_epicfight_compat.mixins.json',
             'net/okitsu/ysmepicfightcompat/CompatMod.class',
             'assets/ysm_epicfight_compat/lang/en_us.json',
             'assets/ysm_epicfight_compat/lang/ja_jp.json'].each { entry ->
                if (zip.getEntry(entry) == null) {
                    throw new GradleException("Distribution is missing ${entry}")
                }
            }
            def modsToml = zip.getInputStream(zip.getEntry('META-INF/mods.toml'))
                    .getText('UTF-8')
            def configuredDependency = ~/(?s)\[\[dependencies\.ysm_epicfight_compat\]\]\s*modId="configured"\s*mandatory=false\s*versionRange="\[2\.2\.3,\)"\s*ordering="NONE"\s*side="CLIENT"/
            if (!(modsToml =~ configuredDependency).find()) {
                throw new GradleException(
                        'Distribution must declare Configured 2.2.3+ as a client-side optional dependency')
            }
            ['net/okitsu/ysmepicfightcompat/client/ClientBootstrap.class',
             'net/okitsu/ysmepicfightcompat/client/BattleOverlayConfigScreen.class'].each {
                customScreen ->
                if (zip.getEntry(customScreen) != null) {
                    throw new GradleException(
                            "Distribution contains obsolete custom config screen class ${customScreen}")
                }
            }
            if (zip.entries().toList().any { it.name.startsWith('net/okitsu/ysmmapping/') }) {
                throw new GradleException('Distribution embeds YSM Mapping API classes')
            }
            if (zip.entries().toList().any { it.name.startsWith('com/elfmcys/') }) {
                throw new GradleException('Distribution embeds or directly targets YSM implementation classes')
            }
            ['net/okitsu/ysmepicfightcompat/ysm/',
             'net/okitsu/ysmepicfightcompat/model/',
             'net/okitsu/ysmepicfightcompat/renderer/'].each { removedPackage ->
                if (zip.entries().toList().any { it.name.startsWith(removedPackage) }) {
                    throw new GradleException("Distribution contains removed legacy package ${removedPackage}")
                }
            }
            def forbiddenText = ['com/ysmef', 'YSMEpicFightCompat']
            zip.entries().toList().findAll {
                it.name.startsWith('net/okitsu/ysmepicfightcompat/') && it.name.endsWith('.class')
            }.each { classEntry ->
                def classText = new String(zip.getInputStream(classEntry).bytes,
                        java.nio.charset.StandardCharsets.ISO_8859_1)
                if (classText.contains('com/mrcrayfish/configured/')) {
                    throw new GradleException(
                            "Optional Configured integration must not link its API from ${classEntry.name}")
                }
                forbiddenText.each { marker ->
                    if (classText.contains(marker)) {
                        throw new GradleException(
                                "Distribution class ${classEntry.name} contains removed marker ${marker}")
                    }
                }
            }
            def mixinJson = new groovy.json.JsonSlurper().parse(
                    zip.getInputStream(zip.getEntry('ysm_epicfight_compat.mixins.json')))
            def requestJson = new groovy.json.JsonSlurper().parse(
                    zip.getInputStream(zip.getEntry(
                            'META-INF/ysm-mapping-api/requests-v1.json')))
            mixinJson.client.each { mixin ->
                def classPath = mixinJson.package.replace('.', '/') + '/' + mixin + '.class'
                if (zip.getEntry(classPath) == null) {
                    throw new GradleException("Mixin config references missing ${classPath}")
                }
            }
            def playerStateClassRequest = requestJson.symbols.find {
                it.key == 'ysm.player_state.capability.class'
            }
            def playerStateAliasOwner =
                    'net/okitsu/ysmepicfightcompat/ysmref/PlayerStateCapabilityAlias'
            if (playerStateClassRequest?.sourceAlias?.common?.owner != playerStateAliasOwner) {
                throw new GradleException(
                        'Player-state capability request must declare its stable source alias')
            }
            def playerStateMixin =
                    'net.okitsu.ysmepicfightcompat.mixin.PlayerStateCapabilityMixin'
            if (requestJson.mixinRequirements[playerStateMixin] !=
                    ['ysm.player_state.capability.class']) {
                throw new GradleException(
                        'PlayerStateCapabilityMixin must require its mapped capability class')
            }
            if (mixinJson.refmapWrapper) {
                def wrapperPath = mixinJson.package.replace('.', '/') + '/' +
                        mixinJson.refmapWrapper.replace('.', '/') + '.class'
                if (zip.getEntry(wrapperPath) == null) {
                    throw new GradleException(
                            "Mixin config references missing refmap wrapper ${wrapperPath}")
                }
            }
            [
                    CombatOverlayMixin:
                            'net.okitsu.ysmepicfightcompat.ysmref.ModelPreviewRendererAlias',
                    PlayerStateCapabilityMixin:
                            'net.okitsu.ysmepicfightcompat.ysmref.PlayerStateCapabilityAlias'
            ].each { mixinName, sourceAlias ->
                def mixinPath = mixinJson.package.replace('.', '/') +
                        "/${mixinName}.class"
                def mixinEntry = zip.getEntry(mixinPath)
                if (mixinEntry == null) {
                    throw new GradleException("Distribution is missing ${mixinPath}")
                }
                def mixinText = new String(zip.getInputStream(mixinEntry).bytes,
                        java.nio.charset.StandardCharsets.ISO_8859_1)
                if (!mixinText.contains('targets') || !mixinText.contains(sourceAlias)) {
                    throw new GradleException(
                            "${mixinName} must use the string source-alias target so " +
                                    'Mixin 0.8.5 invokes runtime class remapping')
                }
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyDistributions')
}
