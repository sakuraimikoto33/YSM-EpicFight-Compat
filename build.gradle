plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'ysm-epicfight-compat'
}

def ysmMappingApiDependencyVersion = gradle.ext.ysmMappingApiDependencyVersion

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run-server')
            args '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net' }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        forRepositories(fg.repository)
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("maven.modrinth:epic-fight:${epicfight_version}")
    compileOnly "net.okitsu.ysmmapping:api:${ysmMappingApiDependencyVersion}"
    compileOnly fg.deobf('curse.maven:configured-457570:5180900')
    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation 'com.github.luben:zstd-jni:1.5.6-3'
    jarJar 'com.github.luben:zstd-jni:[1.5.6-3,1.5.6-3]'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testCompileOnly "net.okitsu.ysmmapping:api:${ysmMappingApiDependencyVersion}"
    testRuntimeOnly "net.okitsu.ysmmapping:api:${ysmMappingApiDependencyVersion}"
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            ysm_version_range: ysm_version_range,
            epicfight_version_range: epicfight_version_range,
            ysm_mapping_api_version_range: ysm_mapping_api_version_range,
            configured_version_range: configured_version_range,
            touhou_little_maid_version_range: touhou_little_maid_version_range,
            epicfight_touhou_little_maid_version_range:
                    epicfight_touhou_little_maid_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(Jar).configureEach {
    archiveVersion = "mc${minecraft_version}-${mod_version}"
    manifest {
        attributes['MixinConfigs'] = 'ysm_epicfight_compat.mixins.json'
    }
}

jar.finalizedBy('reobfJar')
jarJar.enable()
tasks.named('jarJar').configure {
    finalizedBy 'reobfJarJar'
}

tasks.register('verifyDistributions') {
    dependsOn 'reobfJarJar'
    doLast {
        def archive = tasks.named('jarJar', Jar).get().archiveFile.get().asFile
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            ['META-INF/mods.toml', 'META-INF/ysm-mapping-api/requests-v1.json',
             'ysm_epicfight_compat.mixins.json',
             'net/okitsu/ysmepicfightcompat/CompatMod.class',
             'net/okitsu/ysmepicfightcompat/integration/configured/ConfiguredHeldItemRules.class',
             'net/okitsu/ysmepicfightcompat/mixin/ConfiguredForgeConfigMixin.class',
             'net/okitsu/ysmepicfightcompat/mixin/ConfiguredForgeFolderEntryMixin.class',
             'net/okitsu/ysmepicfightcompat/integration/tlm/TouhouMaidSelectionAccess.class',
             'net/okitsu/ysmepicfightcompat/integration/tlm/TouhouMaidAnimationStateAccess.class',
             'net/okitsu/ysmepicfightcompat/integration/tlm/TouhouMaidRenderBridge.class',
             'net/okitsu/ysmepicfightcompat/mixin/PatchedLivingEntityRendererMixin.class',
             'net/okitsu/ysmepicfightcompat/mixin/TouhouMaidAnimationStateMixin.class',
             'net/okitsu/ysmepicfightcompat/mixin/TouhouMaidRendererMixin.class',
             'assets/ysm_epicfight_compat/lang/en_us.json',
             'assets/ysm_epicfight_compat/lang/ja_jp.json'].each { entry ->
                if (zip.getEntry(entry) == null) {
                    throw new GradleException("Distribution is missing ${entry}")
                }
            }
            def modsToml = zip.getInputStream(zip.getEntry('META-INF/mods.toml'))
                    .getText('UTF-8')
            def configuredDependency = ~/(?s)\[\[dependencies\.ysm_epicfight_compat\]\]\s*modId="configured"\s*mandatory=false\s*versionRange="\[2\.2\.3,\)"\s*ordering="NONE"\s*side="CLIENT"/
            if (!(modsToml =~ configuredDependency).find()) {
                throw new GradleException(
                        'Distribution must declare Configured 2.2.3+ as a client-side optional dependency')
            }
            def touhouMaidDependency = ~/(?s)\[\[dependencies\.ysm_epicfight_compat\]\]\s*modId="touhou_little_maid"\s*mandatory=false\s*versionRange="\[1\.5,1\.6\)"\s*ordering="AFTER"\s*side="BOTH"/
            if (!(modsToml =~ touhouMaidDependency).find()) {
                throw new GradleException(
                        'Distribution must declare Touhou Little Maid 1.5.x as an optional dependency')
            }
            def eftlmDependency = ~/(?s)\[\[dependencies\.ysm_epicfight_compat\]\]\s*modId="ef_tlm"\s*mandatory=false\s*versionRange="\[1\.1,1\.4\)"\s*ordering="AFTER"\s*side="BOTH"/
            if (!(modsToml =~ eftlmDependency).find()) {
                throw new GradleException(
                        'Distribution must declare supported EFTLM 1.1.x-1.3.x as an optional dependency')
            }
            if (modsToml.contains('configuredProviders')) {
                throw new GradleException(
                        'Distribution must embed held-item rules in the Forge client config, not register a separate Configured provider')
            }
            ['net/okitsu/ysmepicfightcompat/client/ClientBootstrap.class',
             'net/okitsu/ysmepicfightcompat/client/BattleOverlayConfigScreen.class'].each {
                customScreen ->
                if (zip.getEntry(customScreen) != null) {
                    throw new GradleException(
                            "Distribution contains obsolete custom config screen class ${customScreen}")
                }
            }
            if (zip.entries().toList().any { it.name.startsWith('net/okitsu/ysmmapping/') }) {
                throw new GradleException('Distribution embeds YSM Mapping API classes')
            }
            if (zip.entries().toList().any { it.name.startsWith('com/elfmcys/') }) {
                throw new GradleException('Distribution embeds or directly targets YSM implementation classes')
            }
            if (zip.getEntry(
                    'net/okitsu/ysmepicfightcompat/mixin/PatchedEntityRendererScaleMixin.class')
                    != null) {
                throw new GradleException(
                        'Distribution contains obsolete renderer-wide TLM scale compensation')
            }
            def tlmNamespace = 'com/github/tartaricacid/' + 'touhou' + 'littlemaid/'
            if (zip.entries().toList().any { it.name.startsWith(tlmNamespace) }) {
                throw new GradleException('Distribution embeds Touhou Little Maid classes')
            }
            ['net/okitsu/ysmepicfightcompat/ysm/',
             'net/okitsu/ysmepicfightcompat/model/',
             'net/okitsu/ysmepicfightcompat/renderer/'].each { removedPackage ->
                if (zip.entries().toList().any { it.name.startsWith(removedPackage) }) {
                    throw new GradleException("Distribution contains removed legacy package ${removedPackage}")
                }
            }
            def forbiddenText = ['com/ysmef', 'YSMEpicFightCompat']
            def eftlmClassNamePrefix = 'net.EFTLM.'
            def tlmInternalNamespace = 'com/github/tartaricacid/' + 'touhou' +
                    'littlemaid/'
            def tlmClassName = 'com.github.tartaricacid.' + 'touhou' +
                    'littlemaid.entity.passive.EntityMaid'
            zip.entries().toList().findAll {
                it.name.startsWith('net/okitsu/ysmepicfightcompat/') && it.name.endsWith('.class')
            }.each { classEntry ->
                def classText = new String(zip.getInputStream(classEntry).bytes,
                        java.nio.charset.StandardCharsets.ISO_8859_1)
                if (classText.contains('com/mrcrayfish/configured/') &&
                        !classEntry.name.startsWith(
                                'net/okitsu/ysmepicfightcompat/integration/configured/ConfiguredHeldItemRules')) {
                    throw new GradleException(
                            "Configured API linkage escaped the optional integration boundary: ${classEntry.name}")
                }
                if (classText.contains('net/EFTLM/')
                        && classEntry.name !=
                        'net/okitsu/ysmepicfightcompat/mixin/TouhouMaidRendererMixin.class') {
                    throw new GradleException(
                            "Optional TLM/EFTLM API linkage escaped the reflection boundary: ${classEntry.name}")
                }
                if (classText.contains(eftlmClassNamePrefix)
                        && classEntry.name !=
                        'net/okitsu/ysmepicfightcompat/integration/tlm/TouhouMaidRenderBridge.class'
                        && classEntry.name !=
                        'net/okitsu/ysmepicfightcompat/mixin/TouhouMaidRendererMixin.class') {
                    throw new GradleException(
                            "EFTLM target identity escaped the optional integration boundary: ${classEntry.name}")
                }
                if (classText.contains(tlmInternalNamespace)) {
                    throw new GradleException(
                            "Direct Touhou Little Maid type linkage escaped the optional reflection boundary: ${classEntry.name}")
                }
                if (classText.contains(tlmClassName)
                        && classEntry.name !=
                        'net/okitsu/ysmepicfightcompat/mixin/TouhouMaidAnimationStateMixin.class') {
                    throw new GradleException(
                            "Optional TLM entity linkage escaped the Mixin boundary: ${classEntry.name}")
                }
                forbiddenText.each { marker ->
                    if (classText.contains(marker)) {
                        throw new GradleException(
                                "Distribution class ${classEntry.name} contains removed marker ${marker}")
                    }
                }
            }
            def compatMeshEntry = zip.getEntry(
                    'net/okitsu/ysmepicfightcompat/mesh/CompatHumanoidMesh.class')
            def compatMeshText = new String(zip.getInputStream(compatMeshEntry).bytes,
                    java.nio.charset.StandardCharsets.ISO_8859_1)
            if (!compatMeshText.contains(
                    'net/okitsu/ysmepicfightcompat/integration/tlm/TouhouMaidRenderBridge')
                    || !compatMeshText.contains('meshDrawScale')) {
                throw new GradleException(
                        'Converted mesh must own the scoped TLM inverse-scale push/pop')
            }
            def mixinJson = new groovy.json.JsonSlurper().parse(
                    zip.getInputStream(zip.getEntry('ysm_epicfight_compat.mixins.json')))
            def requestJson = new groovy.json.JsonSlurper().parse(
                    zip.getInputStream(zip.getEntry(
                            'META-INF/ysm-mapping-api/requests-v1.json')))
            ((mixinJson.mixins ?: []) + (mixinJson.client ?: [])).each { mixin ->
                def classPath = mixinJson.package.replace('.', '/') + '/' + mixin + '.class'
                if (zip.getEntry(classPath) == null) {
                    throw new GradleException("Mixin config references missing ${classPath}")
                }
            }
            def playerStateClassRequest = requestJson.symbols.find {
                it.key == 'ysm.player_state.capability.class'
            }
            def playerStateAliasOwner =
                    'net/okitsu/ysmepicfightcompat/ysmref/PlayerStateCapabilityAlias'
            if (playerStateClassRequest?.sourceAlias?.common?.owner != playerStateAliasOwner) {
                throw new GradleException(
                        'Player-state capability request must declare its stable source alias')
            }
            def playerStateMixin =
                    'net.okitsu.ysmepicfightcompat.mixin.PlayerStateCapabilityMixin'
            if (requestJson.mixinRequirements[playerStateMixin] !=
                    ['ysm.player_state.capability.class']) {
                throw new GradleException(
                        'PlayerStateCapabilityMixin must require its mapped capability class')
            }
            def configurationExpressionKey =
                    'ysm.client.animation_roulette.configuration_expression.method'
            def configurationExpressionRequest = requestJson.symbols.find {
                it.key == configurationExpressionKey
            }
            def configurationExpressionAlias = [
                    owner: 'net/okitsu/ysmepicfightcompat/ysmref/AnimationRouletteScreenAlias',
                    name: 'executeConfigurationExpression',
                    descriptor: '(Ljava/lang/String;Ljava/util/function/Consumer;)V'
            ]
            if (configurationExpressionRequest?.sourceAlias?.common !=
                    configurationExpressionAlias ||
                    configurationExpressionRequest.containsKey('definition')) {
                throw new GradleException(
                        'Configuration-expression request must use the curated Mapping API key ' +
                                'with its stable source alias')
            }
            def configurationExpressionMixin =
                    'net.okitsu.ysmepicfightcompat.mixin.YsmConfigurationExpressionMixin'
            if (requestJson.mixinRequirements[configurationExpressionMixin] !=
                    [configurationExpressionKey]) {
                throw new GradleException(
                        'YsmConfigurationExpressionMixin must require its curated mapped method')
            }
            def subEntityMappings = [
                    'net.okitsu.ysmepicfightcompat.mixin.CombatOverlayMixin': [
                            key: 'ysm.client.renderer.model_preview.render_player_overlay.method',
                            owner: 'net/okitsu/ysmepicfightcompat/ysmref/ModelPreviewRendererAlias',
                            name: 'renderPlayerOverlay'
                    ],
                    'net.okitsu.ysmepicfightcompat.mixin.YsmProjectileRendererMixin': [
                            key: 'ysm.client.renderer.custom_projectile.render.method',
                            owner: 'net/okitsu/ysmepicfightcompat/ysmref/CustomProjectileRendererAlias',
                            name: 'renderProjectile'
                    ],
                    'net.okitsu.ysmepicfightcompat.mixin.YsmFishingHookRendererMixin': [
                            key: 'ysm.client.renderer.custom_fishing_hook.render.method',
                            owner: 'net/okitsu/ysmepicfightcompat/ysmref/CustomFishingHookRendererAlias',
                            name: 'tryRenderCustomHook'
                    ],
                    'net.okitsu.ysmepicfightcompat.mixin.YsmVehicleRendererMixin': [
                            key: 'ysm.client.renderer.custom_vehicle.render.method',
                            owner: 'net/okitsu/ysmepicfightcompat/ysmref/CustomVehicleRendererAlias',
                            name: 'renderVehicle'
                    ],
                    'net.okitsu.ysmepicfightcompat.mixin.YsmVehiclePreviewMixin': [
                            key: 'ysm.client.renderer.model_preview.render_vehicle.method',
                            owner: 'net/okitsu/ysmepicfightcompat/ysmref/ModelPreviewRendererAlias',
                            name: 'renderVehicleModel'
                    ]
            ]
            subEntityMappings.each { mixin, expected ->
                def request = requestJson.symbols.find { it.key == expected.key }
                if (request?.kind != 'METHOD' || request?.required != true
                        || request?.sourceAlias?.common?.owner != expected.owner
                        || request?.sourceAlias?.common?.name != expected.name
                        || request.containsKey('definition')) {
                    throw new GradleException(
                            "${expected.key} must retain its curated required source alias without a consumer definition")
                }
                if (requestJson.mixinRequirements[mixin] != [expected.key]) {
                    throw new GradleException(
                            "${mixin} must require only ${expected.key}")
                }
            }
            if (mixinJson.refmapWrapper) {
                def wrapperPath = mixinJson.package.replace('.', '/') + '/' +
                        mixinJson.refmapWrapper.replace('.', '/') + '.class'
                if (zip.getEntry(wrapperPath) == null) {
                    throw new GradleException(
                            "Mixin config references missing refmap wrapper ${wrapperPath}")
                }
            }
            [
                    CombatOverlayMixin:
                            'net.okitsu.ysmepicfightcompat.ysmref.ModelPreviewRendererAlias',
                    PlayerStateCapabilityMixin:
                            'net.okitsu.ysmepicfightcompat.ysmref.PlayerStateCapabilityAlias',
                    YsmConfigurationExpressionMixin:
                            'net.okitsu.ysmepicfightcompat.ysmref.AnimationRouletteScreenAlias',
                    YsmProjectileRendererMixin:
                            'net.okitsu.ysmepicfightcompat.ysmref.CustomProjectileRendererAlias',
                    YsmFishingHookRendererMixin:
                            'net.okitsu.ysmepicfightcompat.ysmref.CustomFishingHookRendererAlias',
                    YsmVehicleRendererMixin:
                            'net.okitsu.ysmepicfightcompat.ysmref.CustomVehicleRendererAlias',
                    YsmVehiclePreviewMixin:
                            'net.okitsu.ysmepicfightcompat.ysmref.ModelPreviewRendererAlias'
            ].each { mixinName, sourceAlias ->
                def mixinPath = mixinJson.package.replace('.', '/') +
                        "/${mixinName}.class"
                def mixinEntry = zip.getEntry(mixinPath)
                if (mixinEntry == null) {
                    throw new GradleException("Distribution is missing ${mixinPath}")
                }
                def mixinText = new String(zip.getInputStream(mixinEntry).bytes,
                        java.nio.charset.StandardCharsets.ISO_8859_1)
                if (!mixinText.contains('targets') || !mixinText.contains(sourceAlias)) {
                    throw new GradleException(
                            "${mixinName} must use the string source-alias target so " +
                                    'Mixin 0.8.5 invokes runtime class remapping')
                }
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyDistributions')
}
