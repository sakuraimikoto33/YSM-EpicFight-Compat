modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neoforge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="yes_steve_model"
    type="required"
    versionRange="${ysm_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="epicfight"
    type="required"
    versionRange="${epicfight_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ysm_mapping_api"
    type="required"
    versionRange="[${ysm_mapping_api_version_range},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="configured"
    type="optional"
    versionRange="${configured_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="touhou_little_maid"
    type="optional"
    versionRange="${touhou_little_maid_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ef_tlm"
    type="optional"
    versionRange="${epicfight_touhou_little_maid_version_range}"
    ordering="AFTER"
    side="BOTH"

[[mixins]]
    config="ysm_epicfight_compat.mixins.json"
